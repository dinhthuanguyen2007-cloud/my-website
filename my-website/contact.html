<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Nguyễn Đình Thuận</title>
</head>

<body>

    <header>
        <h1>Liên hệ</h1>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <main>

        <form>

            <fieldset>
                <legend>Thông tin cá nhân</legend>

                <p>
                    <label for="fullname">Họ và tên:</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Nhập họ tên đầy đủ"
                        required minlength="2" maxlength="100">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required>
                </p>

                <p>
                    <label for="phone">Số điện thoại:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09xx xxx xxx"
                        pattern="[0-9]{10,11}">
                </p>

                <p>
                    <label for="date of birth">Ngày sinh</label>
                    <input type="date"
                    id="date"
                    name="date"
                    placeholder="dd/mm/yyyy">
                </p>

                <p>
                    <label for="truong">Trường đại học:</label>
                    <input type="text" id="truong" name="truong" list="ds-truong">

                    <datalist id="ds-truong">
                    <option value="Đại học Công nghiệp TP.HCM">
                    <option value="Đại học Kinh tế TP.HCM">
                    <option value="Đại học Quốc gia TP.HCM">
                    <option value="Đại học Sư phạm Kỹ thuật TP.HCM">
                    </datalist>
                </p>

            </fieldset>

            <fieldset>
                <legend>Nội dung liên hệ</legend>

                <p>
                    <label for="subject">Chủ đề:</label>

                    <select id="subject" name="subject">
                        <option value="">-- Chọn chủ đề --</option>
                        <option value="hoc-tap">Hỗ trợ kỹ thuật</option>
                        <option value="lien-he">Học tập / Trao đổi</option>
                        <option value="khac">Khác</option>
                    </select>
                </p>

                <p>
                    <label> Ưu tiên liên hệ qua: </label>
                    <fieldset>
                        <legend>Kênh liên hệ</legend>
                        <input type="radio" id="via-email" name="contact-via" value="email" checked>
                        <label for="via-email">Email</label>
                        <input type="radio" id="via-email" name="contact-via" value="phone">
                        <label for="via-phone">Điện thoại </label>
                        <input type="radio" id="via-zalo" name="contact-via" value="zalo">
                        <label for="via-zalo">Zalo</label>
                    </fieldset>
                </p>

                <p>
                    <label for="message">Nội dung tin nhắn:</label>
                </p>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Nhập nội dung tin nhắn..."
                    required minlength="10"
                    maxlength="500">
                </textarea>

                    <label>
                        <input type="checkbox" name="agree" required>
                        Tôi đồng ý với <a href="#"> điều khoản sử dụng </a>
                    </label>

            </fieldset>

            <br>

            <button type="submit">Gửi</button>
            <button type="reset">Xóa</button>

        </form>

    </main>

    <footer>
        <address>
            Email:
            <a href="mailto:dinhthuanguyen2007@gmail.com">
                dinhthuanguyen2007@gmail.com
            </a>
        </address>
    </footer>

</body>
</html>
